[server]
headless = true
address = "127.0.0.1"
maxUploadSize = 2

[browser]
gatherUsageStats = false

[client]
showSidebarNavigation = false
toolbarMode = "viewer"

# Native tokens apply to forms, menus, charts, tables and callouts consistently.
# A system-font stack keeps Thai text available without a font-service request.
# Keep chart palettes in the Plotly helpers and inherit dataframe header text.
# Their variant-specific config keys are not supported by every installation.
[theme]
base = "light"
font = "'Leelawadee UI', 'Noto Sans Thai', 'Tahoma', sans-serif"
headingFont = "'Leelawadee UI', 'Noto Sans Thai', 'Tahoma', sans-serif"
# Two size steps: 16 -> 18 -> 20 px; rem-based headings scale with this value.
baseFontSize = 20
baseFontWeight = 400
headingFontSizes = ["2.3rem", "1.45rem", "1.18rem", "1.05rem", "1rem", "1rem"]
headingFontWeights = [700, 650, 600, 600, 600, 600]
baseRadius = "14px"
buttonRadius = "12px"
showWidgetBorder = true
showSidebarBorder = false
linkUnderline = true

[theme.light]
primaryColor = "#9D4566"
backgroundColor = "#FAF8F7"
secondaryBackgroundColor = "#FFFDFE"
textColor = "#120D18"
borderColor = "#88718D"
linkColor = "#8F3B5E"
codeBackgroundColor = "#F4EDF6"
