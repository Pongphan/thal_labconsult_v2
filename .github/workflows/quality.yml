name: ThalLink quality

on:
  push:
  pull_request:
  merge_group:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: thallink-quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: thallink-quality
    runs-on: windows-latest
    timeout-minutes: 20
    env:
      PYTHONUTF8: '1'
      PYTHONIOENCODING: utf-8
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (standalone or parent repository)
        id: project
        shell: pwsh
        run: |
          if (Test-Path -LiteralPath 'thal_labconsult/app.py') {
            'path=thal_labconsult' >> $env:GITHUB_OUTPUT
          } elseif (Test-Path -LiteralPath 'app.py') {
            'path=.' >> $env:GITHUB_OUTPUT
          } else {
            throw 'thal_labconsult source not found'
          }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install hashed runtime and complete test dependency lock
        working-directory: ${{ steps.project.outputs.path }}
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r requirements-dev-lock-win-py312.txt
      - name: Verify runtime
        working-directory: ${{ steps.project.outputs.path }}
        run: python scripts/check_environment.py --locked --development
      - name: Lint for Python correctness
        working-directory: ${{ steps.project.outputs.path }}
        run: python -m ruff check .
      - name: Check rule review inventory matches source
        working-directory: ${{ steps.project.outputs.path }}
        run: python scripts/generate_rule_inventory.py --check
      - name: Full regression suite and coverage gate
        working-directory: ${{ steps.project.outputs.path }}
        run: python -m pytest --junitxml=artifacts/junit.xml --cov --cov-report=term-missing --cov-report=xml:artifacts/coverage.xml --cov-report=html:artifacts/htmlcov --cov-report=json:artifacts/coverage.json
      - name: Verify source package
        working-directory: ${{ steps.project.outputs.path }}
        run: python scripts/package_source.py --check
      - name: Install pinned Playwright Chromium build
        working-directory: ${{ steps.project.outputs.path }}
        run: python -m playwright install chromium
      - name: Synthetic browser and printable-report QA
        working-directory: ${{ steps.project.outputs.path }}
        run: python scripts/browser_smoke.py
      - name: Publish test summary
        if: always()
        working-directory: ${{ steps.project.outputs.path }}
        run: python scripts/ci_summary.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: thallink-test-results
          path: ${{ steps.project.outputs.path }}/artifacts/
          if-no-files-found: warn
          retention-days: 14
